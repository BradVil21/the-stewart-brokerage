# Cloudflare Worker that guards thestewartbrokerage.com
name = "stewart-ip-gate"
main = "worker.js"
compatibility_date = "2024-09-23"

# Run in front of every page on the site.
routes = [
  { pattern = "thestewartbrokerage.com/*", zone_name = "thestewartbrokerage.com" },
  { pattern = "www.thestewartbrokerage.com/*", zone_name = "thestewartbrokerage.com" }
]

[vars]
# Comma-separated. Single IPs or IPv4 ranges (e.g. "12.247.0.0/24").
BLOCKED_IPS = "12.247.0.158"
SITE_NAME = "The Stewart Brokerage"

# Created by: npx wrangler kv namespace create GATE_KV
# Paste the id it prints here.
[[kv_namespaces]]
binding = "GATE_KV"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# ADMIN_PASSWORD is a secret, NOT stored here:
#   npx wrangler secret put ADMIN_PASSWORD
